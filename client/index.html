<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>CampusKart</title>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    
    <header>
      <a href="index.html" class="brand"><span class="brand-mark">¢к</span>Campus<span>Kart</span></a>
      <nav>
        <a class="active" href="index.html">Marketplace</a>
        <a class="auth-only" href="my-listings.html">My Listings</a>
        <a class="auth-only" href="wishlist.html">Saved</a>
        <a class="auth-only btn" href="sell.html">+ Sell an item</a>
        <a class="guest-only" href="login.html">Login</a>

        <div class="auth-only user-menu">
          <button id="userButton" class="user-button">
            <span id="userName">User</span>
            <span class="arrow">⌄</span>
          </button>
          <div id="userDropdown" class="user-dropdown">
            <p id="userEmail"></p>
            <button id="logoutBtn">Log out</button>
          </div>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <p>STUDENT MARKETPLACE</p>
        <h1>Everything you need,<br /><span>already on campus.</span></h1>
        <div class="search">
          <input
            id="search"
            placeholder=" ⌕  Search books, cycles, electronics..." /><button id="searchBtn">Search</button>
        </div>
      </section>

      <section>
        <div class="market-heading">
          <div>
            <small class="explore">EXPLORE</small>
            <h2>Campus marketplace</h2>
            <p id="count"></p>
          </div>
          <div id="pills"></div>
        </div>
        <div class="filters">
          <input id="mirror" placeholder="⌕ Search listings" />
          <select id="cat"></select>
          <input id="max" type="number" placeholder="Max price" />
          <select id="sort">
            <option value="newest">Newest</option>
            <option value="low">Price: Low</option>
            <option value="high">Price: High</option></select>
          <button id="clear">Clear</button>
        </div>
        <div id="grid" class="grid"></div>
      </section>
      <div id="toast"></div>
    </main>
    <br>

    <footer class="footer">
      <div class="container footer-inner">
        <div class="footer-left">
        <a href="index.html" class="brand">Campus<span>Kart</span></a>
          <p>A student marketplace prototype.</p>
        </div>
        <div class="footer-right"><span>Built with HTML · CSS · JavaScript</span><span>© <span id="currentYear">2026</span>
            CampusKart</span></div>
      </div>
    </footer>
    <script src="js/common.js"></script>
    <script src="js/index.js"></script>
  </body>
</html>
